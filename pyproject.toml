[project]
name = "biteki-hantei"
version = "0.1.0"
description = ""
authors = [{name = "tomo3141592653", email = "tomo3141592653@gmail.com"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32.3",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "numpy>=2.0.1",
    "pillow>=10.4.0",
    "clip @ git+https://github.com/openai/CLIP.git",
    "tqdm>=4.66.4",
    "packaging>=24.1",
    "rawpy>=0.22.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "gradio>=4.39.0",
    "pillow-heif>=0.18.0",
    "scikit-learn>=1.5.1",
    "pyinstaller>=6.5.0",
    "playwright>=1.60.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
index-strategy = "unsafe-best-match"

[tool.uv.extra-build-dependencies]
clip = ["setuptools<81"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
